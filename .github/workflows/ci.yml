name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Cargo build (release)
        run: cargo build --release --verbose --features alternative-alloc
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rsspub-linux-x86_64
          path: target/release/rsspub
          if-no-files-found: error

  frontend:
    name: Frontend (Deno / Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install UI dependencies
        run: deno install

      - name: Check UI types
        run: deno task check

      - name: Build UI
        run: deno task build
